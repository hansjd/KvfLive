name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      shared_web: ${{ steps.filter.outputs.shared_web }}
      android_tv: ${{ steps.filter.outputs.android_tv }}
      apple_tv: ${{ steps.filter.outputs.apple_tv }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect changed project files
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.ref_name }}
          filters: |
            shared_web:
              - 'scripts/shared-config.test.mjs'
              - 'scripts/tv-project-validation.test.mjs'
              - 'scripts/web-player.test.mjs'
              - 'scripts/sync-shared-config.mjs'
              - 'scripts/validate-tv-web-projects.mjs'
              - 'scripts/webos.mjs'
              - 'scripts/gen-icon*.mjs'
              - 'scripts/download-icon.mjs'
              - 'packages/shared/**'
              - 'webos/**'
              - 'tizen/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/**'
            android_tv:
              - 'android-tv/**'
              - 'packages/shared/**'
              - 'scripts/sync-shared-config.mjs'
              - 'scripts/android-tv.mjs'
              - '.github/workflows/**'
            apple_tv:
              - 'apple-tv/**'
              - 'packages/shared/**'
              - 'scripts/sync-shared-config.mjs'
              - '.github/workflows/**'

  shared-web-checks:
    needs: changes
    if: needs.changes.outputs.shared_web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sync shared config
        run: npm run sync:shared

      - name: Run shared code tests
        run: npm test

      - name: Validate webOS/Tizen/shared files
        run: npm run validate:web

  android-tv-build:
    needs: changes
    if: needs.changes.outputs.android_tv == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build Android TV debug APK
        working-directory: android-tv
        run: gradle :app:assembleDebug

      - name: Run Android TV unit tests
        working-directory: android-tv
        run: gradle :app:testDebugUnitTest

  appletv-build:
    needs: changes
    if: needs.changes.outputs.apple_tv == 'true'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: apple-tv
        run: xcodegen generate

      - name: Build and test tvOS simulator target
        working-directory: apple-tv
        run: xcodebuild -project KvfLiveAppleTV.xcodeproj -scheme KvfLiveAppleTV -destination 'platform=tvOS Simulator,name=Apple TV 4K (3rd generation)' CODE_SIGNING_ALLOWED=NO test
