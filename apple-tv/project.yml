name: KvfLiveAppleTV
options:
  bundleIdPrefix: com.kvflive

targets:
  KvfLiveAppleTV:
    type: application
    platform: tvOS
    deploymentTarget: "15.0"
    sources:
      - TVApp/Sources
    resources:
      - TVApp/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kvflive.appletv
        INFOPLIST_FILE: TVApp/Resources/Info.plist
        SWIFT_VERSION: 5.0
